name: Build and test Thistle Bundles v6
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build --if-present
  # Intentional: do NOT auto-deploy production inventory integrations.
  # Use `fly deploy` manually after confirming the app URL and secrets.

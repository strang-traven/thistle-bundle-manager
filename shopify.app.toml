client_id = "1013a53870a625bd3d098d19148d266d"
name = "Thistle Pre-Order Bundles"
application_url = "https://thistle-bundle-manager.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "orders/cancelled", "orders/paid", "refunds/create", "fulfillments/create", "inventory_levels/update", "app/uninstalled"]
uri = "/webhooks/shopify"

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_orders,read_fulfillments,read_locations,read_markets_home,read_cart_transforms,write_cart_transforms,read_publications,write_publications"

[auth]
redirect_urls = ["https://thistle-bundle-manager.fly.dev/auth/callback"]

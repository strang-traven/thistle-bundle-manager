# Use `shopify app config link` to link the EXISTING Thistle Pre-Order Bundles app.
# Replace placeholders after `fly launch`; do not reuse a different app's client ID.
client_id = "REPLACE_WITH_EXISTING_BUNDLE_APP_CLIENT_ID"
name = "Thistle Pre-Order Bundles"
application_url = "https://REPLACE-WITH-YOUR-FLY-APP.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "orders/cancelled", "orders/paid", "refunds/create", "fulfillments/create", "inventory_levels/update", "app/uninstalled"]
uri = "/webhooks/shopify"

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_orders,read_locations,read_markets_home,read_cart_transforms,write_cart_transforms"

[auth]
redirect_urls = ["https://REPLACE-WITH-YOUR-FLY-APP.fly.dev/auth/callback"]

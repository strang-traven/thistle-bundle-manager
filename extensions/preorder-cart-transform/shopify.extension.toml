api_version = "2026-07"

[[extensions]]
name = "Thistle large pre-order bundle transform"
handle = "thistle-preorder-cart-transform"
type = "function"
description = "Expands up to 150 card variants into Shopify-tracked inventory lines."

[[extensions.targeting]]
target = "cart.transform.run"
input_query = "src/cart_transform_run.graphql"
export = "cart-transform-run"

[extensions.build]
command = ""
path = "dist/function.wasm"

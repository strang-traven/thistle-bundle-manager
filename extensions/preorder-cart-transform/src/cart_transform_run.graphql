query Input {
  cart {
    lines {
      id
      quantity
      group: attribute(key: "_tt_bundle_group") { value }
      part: attribute(key: "_tt_bundle_part") { value }
      total: attribute(key: "_tt_bundle_total") { value }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          liveEnabled: metafield(namespace: "tt_preorders", key: "live_enabled") {
            value
          }
          liveConfig: metafield(namespace: "tt_preorders", key: "live_components") {
            jsonValue
          }
          livePart: metafield(namespace: "tt_preorders", key: "live_part") {
            jsonValue
          }
        }
      }
    }
  }
}
